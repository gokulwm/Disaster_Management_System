name: disaster_link
description: DisasterLink — A disaster management system that connects help seekers with verified volunteers. Works online via Supabase and offline via Bluetooth relay.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Backend & Auth
  supabase_flutter: ^2.8.2

  # Maps & Location
  flutter_map: ^7.0.2
  flutter_map_tile_caching: ^9.1.3
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Offline Storage
  sqflite: ^2.4.1
  path: ^1.9.0

  # Bluetooth / Nearby Connections
  flutter_nearby_connections: ^1.1.2

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.6

  # Networking & Connectivity
  connectivity_plus: ^6.1.1
  http: ^1.2.2

  # Routing
  go_router: ^14.8.1

  # UI & Theming
  google_fonts: ^6.2.1

  # Device Info & Storage
  device_info_plus: ^11.2.1
  shared_preferences: ^2.3.4

  # UUID Generation
  uuid: ^4.5.1

  # Foreground Service (Android BLE keep-alive)
  flutter_foreground_task: ^8.12.0

  # Cupertino Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
